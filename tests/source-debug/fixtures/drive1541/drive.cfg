# The 1541's RAM: code in buffer 2 ($0500), variables in buffer 3 ($0600).
# The output is the raw code, poked in by the test.
MEMORY {
    CODE: file = %O, start = $0500, size = $0100;
    DATA: file = "", start = $0600, size = $0100;
}
SEGMENTS {
    CODE: load = CODE, type = ro;
    BSS:  load = DATA, type = bss, define = yes;
}
