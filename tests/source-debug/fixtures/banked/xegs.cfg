# XEGS 32 KB (CAR type 12): banks 0-2 switch in at $8000, bank 3 is fixed at
# $A000; the output is the .car file, its 16-byte header first. bankA() and
# bankB() both sit at $8000.
MEMORY {
    ZP:        file = "", start = $0082, size = $007E, type = rw, define = yes;
    CARHEADER: file = %O, start = $0000, size = $0010, fill = yes;
    BANK0:     file = %O, start = $8000, size = $2000, fill = yes;
    BANK1:     file = %O, start = $8000, size = $2000, fill = yes;
    BANK2:     file = %O, start = $8000, size = $2000, fill = yes;
    FIXED:     file = %O, start = $A000, size = $1FFA, fill = yes;
    CARTVEC:   file = %O, start = $BFFA, size = $0006, fill = yes;
    RAM:       file = "", start = $3000, size = $1000, define = yes;
    STACK:     file = "", start = $7000, size = $1000, define = yes;
}
SEGMENTS {
    ZEROPAGE:    load = ZP,                type = zp;
    CARHEADER:   load = CARHEADER,         type = ro;
    BANK0:       load = BANK0,             type = ro;
    BANK1:       load = BANK1,             type = ro;
    STARTUP:     load = FIXED,             type = ro,  define = yes;
    CODE:        load = FIXED,             type = ro,  define = yes;
    RODATA:      load = FIXED,             type = ro,  define = yes;
    ONCE:        load = FIXED,             type = ro,  optional = yes;
    DATA:        load = FIXED, run = RAM,  type = rw,  define = yes;
    BSS:         load = RAM,               type = bss, define = yes;
    CARTVECTORS: load = CARTVEC,           type = ro;
}
