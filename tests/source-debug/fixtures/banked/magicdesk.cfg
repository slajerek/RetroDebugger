# Magic Desk (CRT type 19), two 8 KB banks at $8000 (ROML); the output is
# the .crt file itself: its header, then per bank a CHIP header and the
# bank. bankA() and bankB() both sit at $9000. CODE and RODATA load in bank
# 0 and run in RAM.
MEMORY {
    ZP:        file = "", start = $0002, size = $001A, type = rw, define = yes;
    CRTHEADER: file = %O, start = $0000, size = $0040, fill = yes;
    CHIP0:     file = %O, start = $0000, size = $0010, fill = yes;
    BANK0LO:   file = %O, start = $8000, size = $1000, fill = yes;
    BANK0HI:   file = %O, start = $9000, size = $1000, fill = yes;
    CHIP1:     file = %O, start = $0000, size = $0010, fill = yes;
    BANK1LO:   file = %O, start = $8000, size = $1000, fill = yes;
    BANK1HI:   file = %O, start = $9000, size = $1000, fill = yes;
    RAM:       file = "", start = $0800, size = $7000, define = yes;
    STACK:     file = "", start = $7800, size = $0800, define = yes;
}
SEGMENTS {
    ZEROPAGE:  load = ZP,                type = zp;
    CRTHEADER: load = CRTHEADER,         type = ro;
    CHIP0:     load = CHIP0,             type = ro;
    CHIP1:     load = CHIP1,             type = ro;
    CARTHDR:   load = BANK0LO,           type = ro;
    STARTUP:   load = BANK0LO,           type = ro,  define = yes;
    CODE:      load = BANK0LO, run = RAM, type = ro,  define = yes;
    RODATA:    load = BANK0LO, run = RAM, type = ro,  define = yes;
    ONCE:      load = BANK0LO, run = RAM, type = ro,  optional = yes;
    DATA:      load = BANK0LO, run = RAM, type = rw,  define = yes;
    BSS:       load = RAM,               type = bss, define = yes;
    BANK0:     load = BANK0HI,           type = ro;
    BANK1:     load = BANK1HI,           type = ro;
}
