# MMC3 (mapper 4), PRG mode 0: banks 0 and 1 switch in at $8000 (R6), the
# last two banks are fixed at $C000 and $E000. Variables in the console's
# own RAM.
MEMORY {
    ZP:     file = "", start = $0002, size = $001A, type = rw, define = yes;
    HEADER: file = %O, start = $0000, size = $0010, fill = yes;
    BANK0:  file = %O, start = $8000, size = $2000, fill = yes;
    BANK1:  file = %O, start = $8000, size = $2000, fill = yes;
    FIXED:  file = %O, start = $C000, size = $3FFA, fill = yes;
    VECT:   file = %O, start = $FFFA, size = $0006, fill = yes;
    RAM:    file = "", start = $0300, size = $0200, define = yes;
    SRAM:   file = "", start = $0500, size = $0300, define = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,              type = zp;
    HEADER:   load = HEADER,          type = ro;
    BANK0:    load = BANK0,           type = ro;
    BANK1:    load = BANK1,           type = ro;
    STARTUP:  load = FIXED,           type = ro,  define = yes;
    CODE:     load = FIXED,           type = ro,  define = yes;
    RODATA:   load = FIXED,           type = ro,  define = yes;
    ONCE:     load = FIXED,           type = ro,  optional = yes;
    DATA:     load = FIXED, run = RAM, type = rw, define = yes;
    BSS:      load = RAM,             type = bss, define = yes;
    VECTORS:  load = VECT,            type = ro;
}
