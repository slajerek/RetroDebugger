# Pinned toolchain for tests/source-debug (RD-002). Read by scripts/build_fixtures.py.
name: cc65
language: c
version: "2.19"
obtain: "Ubuntu 24.04 package cc65 2.19-1 (apt-get install cc65; the tools report V2.18 - Ubuntu 2.19-1) or Homebrew cc65 2.19 (reports V2.18 - N/A; accepted by its Cellar path)"
executables:
  cc65:
    env: RD_CC65
    candidates: [cc65]
    version_argv: ["{cc65}", "-V"]
    version_match: "2.19"
    version_path_match: "/cc65/2.19/"
  ca65:
    env: RD_CA65
    candidates: [ca65]
    version_argv: ["{ca65}", "-V"]
    version_match: "2.19"
    version_path_match: "/cc65/2.19/"
  ld65:
    env: RD_LD65
    candidates: [ld65]
    version_argv: ["{ld65}", "-V"]
    version_match: "2.19"
    version_path_match: "/cc65/2.19/"
# Compiler, assembler and linker as separate steps (what cl65 does in one), so
# the intermediate main.s gets a pinned mtime before ca65 records it. No -O:
# unoptimized. -g carries C line info through ca65 into ld65's --dbgfile,
# cc65's own TEXT .dbg format -- not KickAssembler's XML (RD-031 sniffs them).
machines:
  c64:
    source: main.c
    steps:
      - ["{cc65}", "-t", "c64", "-g", "main.c"]
      - ["{ca65}", "-t", "c64", "-g", "main.s"]
      - ["{ld65}", "-t", "c64", "--dbgfile", "main.dbg", "-Ln", "main.lbl", "-m", "main.map", "-o", "main.prg", "main.o", "c64.lib"]
    outputs: [main.prg, main.dbg, main.lbl, main.map, main.s]
  atari:
    source: main.c
    steps:
      - ["{cc65}", "-t", "atari", "-g", "main.c"]
      - ["{ca65}", "-t", "atari", "-g", "main.s"]
      - ["{ld65}", "-t", "atari", "--dbgfile", "main.dbg", "-Ln", "main.lbl", "-m", "main.map", "-o", "main.xex", "main.o", "atari.lib"]
    outputs: [main.xex, main.dbg, main.lbl, main.map, main.s]
  nes:
    source: main.c
    steps:
      - ["{cc65}", "-t", "nes", "-g", "main.c"]
      - ["{ca65}", "-t", "nes", "-g", "main.s"]
      - ["{ld65}", "-t", "nes", "--dbgfile", "main.dbg", "-Ln", "main.lbl", "-m", "main.map", "-o", "main.nes", "main.o", "nes.lib"]
    outputs: [main.nes, main.dbg, main.lbl, main.map, main.s]
  # A banked cartridge (RD-026): UxROM with the fixture's own startup and
  # linker config; only fixtures with a uxrom.c build it.
  nes-uxrom:
    source: uxrom.c
    steps:
      - ["{cc65}", "-t", "nes", "-g", "uxrom.c"]
      - ["{ca65}", "-t", "nes", "-g", "uxrom.s"]
      - ["{ca65}", "-t", "nes", "-g", "uxrom-crt0.s"]
      - ["{ld65}", "-C", "uxrom.cfg", "--dbgfile", "main.dbg", "-Ln", "main.lbl", "-m", "main.map", "-o", "main.nes", "uxrom.o", "uxrom-crt0.o", "nes.lib"]
    outputs: [main.nes, main.dbg, main.lbl, main.map, uxrom.s]
  # MMC1 (mapper 1), the serially loaded mapper (RD-026); fixtures with an mmc1.c.
  nes-mmc1:
    source: mmc1.c
    steps:
      - ["{cc65}", "-t", "nes", "-g", "mmc1.c"]
      - ["{ca65}", "-t", "nes", "-g", "mmc1.s"]
      - ["{ca65}", "-t", "nes", "-g", "mmc1-crt0.s"]
      - ["{ld65}", "-C", "mmc1.cfg", "--dbgfile", "main.dbg", "-Ln", "main.lbl", "-m", "main.map", "-o", "main.nes", "mmc1.o", "mmc1-crt0.o", "nes.lib"]
    outputs: [main.nes, main.dbg, main.lbl, main.map, mmc1.s]
  # C64 Magic Desk cartridge (RD-030): the .crt is ld65's output, header and
  # CHIP packets included; fixtures with a magicdesk.c.
  c64-magicdesk:
    source: magicdesk.c
    steps:
      - ["{cc65}", "-t", "c64", "-g", "magicdesk.c"]
      - ["{ca65}", "-t", "c64", "-g", "magicdesk.s"]
      - ["{ca65}", "-t", "c64", "-g", "magicdesk-crt0.s"]
      - ["{ld65}", "-C", "magicdesk.cfg", "--dbgfile", "main.dbg", "-Ln", "main.lbl", "-m", "main.map", "-o", "main.crt", "magicdesk.o", "magicdesk-crt0.o", "c64.lib"]
    outputs: [main.crt, main.dbg, main.lbl, main.map, magicdesk.s]
  # Atari XEGS 32 KB cartridge (RD-030): the .car is ld65's output, header
  # included; car_checksum.py fills in its checksum. Fixtures with an xegs.c.
  atari-xegs:
    source: xegs.c
    steps:
      - ["{cc65}", "-t", "atari", "-g", "xegs.c"]
      - ["{ca65}", "-t", "atari", "-g", "xegs.s"]
      - ["{ca65}", "-t", "atari", "-g", "xegs-crt0.s"]
      - ["{ld65}", "-C", "xegs.cfg", "--dbgfile", "main.dbg", "-Ln", "main.lbl", "-m", "main.map", "-o", "main.car", "xegs.o", "xegs-crt0.o", "atari.lib"]
      - ["{python}", "-I", "{scripts}/car_checksum.py", "main.car"]
    outputs: [main.car, main.dbg, main.lbl, main.map, xegs.s]
  # The 1541 drive CPU (RD-044): ca65 code for drive RAM; fixtures with a drive.s.
  drive1541:
    source: drive.s
    steps:
      - ["{ca65}", "-g", "drive.s"]
      - ["{ld65}", "-C", "drive.cfg", "--dbgfile", "main.dbg", "-Ln", "main.lbl", "-m", "main.map", "-o", "main.bin", "drive.o"]
    outputs: [main.bin, main.dbg, main.lbl, main.map]
  # MMC3 (mapper 4), 8 KB banks selected through R6 (RD-026); fixtures with an mmc3.c.
  nes-mmc3:
    source: mmc3.c
    steps:
      - ["{cc65}", "-t", "nes", "-g", "mmc3.c"]
      - ["{ca65}", "-t", "nes", "-g", "mmc3.s"]
      - ["{ca65}", "-t", "nes", "-g", "mmc3-crt0.s"]
      - ["{ld65}", "-C", "mmc3.cfg", "--dbgfile", "main.dbg", "-Ln", "main.lbl", "-m", "main.map", "-o", "main.nes", "mmc3.o", "mmc3-crt0.o", "nes.lib"]
    outputs: [main.nes, main.dbg, main.lbl, main.map, mmc3.s]
